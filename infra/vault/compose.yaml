name: federated-copilot-authority
services:
  vault:
    image: hashicorp/vault:1.21@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
    command: ["server"]
    cap_add: [IPC_LOCK]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9470:8200"
    environment:
      VAULT_ADDR: https://localhost:8200
      VAULT_CACERT: /vault/tls/ca.pem
    volumes:
      - vault-data:/vault/file
      - ./server.hcl:/vault/config/server.hcl:ro
      - ../../.local/pingfederate/localhost.pem:/vault/tls/cert.pem:ro
      - ../../.local/pingfederate/localhost-key.pem:/vault/tls/key.pem:ro
      - ../../.local/pingfederate/ca.pem:/vault/tls/ca.pem:ro
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  vault-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${VAULT_DOCKER_SUBNET:-10.235.0.0/24}
